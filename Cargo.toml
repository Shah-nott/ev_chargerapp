[package]
name = "ev_charger_app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"       # Add this dependency for Actix framework
actix-files = "0.6"     # Add this dependency to serve static files
tokio = { version = "1", features = ["full"] }  # Tokio for async operations
btleplug = "0.11"       # For Bluetooth communication
serde = { version = "1.0", features = ["derive"] }  # For serialization
serde_json = "1.0"      # For handling JSON
uuid = { version = "1", features = ["v4"] }     # For handling UUIDs
tokio-stream = "0.1"    # For stream processing in Tokio
futures-util = "0.3" 
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "time"] }
dotenv = "0.15"
argon2 = "0.5"
actix-session = { version = "0.9", features = ["cookie-session"] }
